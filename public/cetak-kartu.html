<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Cetak Kartu QR Absensi - SMKN Kasomalang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
    <style>
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; padding: 0 !important; }
            .card-grid { gap: 10px !important; }
            .student-card {
                break-inside: avoid;
                page-break-inside: avoid;
                border: 1.5px solid #1e293b !important;
                box-shadow: none !important;
            }
        }
    </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800">

    <!-- TOOLBAR -->
    <div class="no-print bg-slate-900 text-white px-6 py-4 sticky top-0 z-20 shadow-md flex flex-wrap justify-between items-center gap-4">
        <div class="flex items-center gap-3">
            <a href="/dashboard.html" class="bg-slate-800 hover:bg-slate-700 px-3 py-2 rounded-xl text-xs font-semibold">
                <i class="fa-solid fa-arrow-left mr-1"></i> Kembali
            </a>
            <div>
                <h1 class="font-bold text-base">Cetak Kartu QR Code Siswa</h1>
                <p class="text-xs text-slate-400">SMKN Kasomalang • Format Kertas A4 (9 Kartu/Halaman)</p>
            </div>
        </div>

        <div class="flex flex-wrap items-center gap-3">
            <select id="filter-jurusan" onchange="filterKelasByJurusan()" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2">
                <option value="">Semua Jurusan</option>
            </select>
            <select id="filter-kelas" onchange="renderCards()" class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2">
                <option value="">Semua Kelas</option>
            </select>
            <input type="text" id="filter-nama" onkeyup="renderCards()" placeholder="Cari nama / NISN..." class="bg-slate-800 border border-slate-700 text-white text-xs rounded-xl px-3 py-2 w-44">
            <button onclick="window.print()" class="bg-blue-600 hover:bg-blue-500 text-white px-5 py-2 rounded-xl text-xs font-bold shadow-lg flex items-center gap-2">
                <i class="fa-solid fa-print"></i> Cetak / Simpan PDF
            </button>
        </div>
    </div>

    <!-- AREA KARTU SISWA -->
    <main class="max-w-5xl mx-auto p-6">
        <div id="cards-container" class="card-grid grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4"></div>
    </main>

    <script>
        let allSiswa = [], allKelas = [], allJurusan = [];

        async function init() {
            const auth = await fetch('/api/me');
            if (!auth.ok) return window.location.href = '/login.html';

            allJurusan = await fetch('/api/jurusan').then(r => r.json());
            allKelas = await fetch('/api/kelas').then(r => r.json());
            allSiswa = await fetch('/api/siswa').then(r => r.json());

            document.getElementById('filter-jurusan').innerHTML =
                '<option value="">Semua Jurusan</option>' +
                allJurusan.map(j => `<option value="${j.id}">${j.kode_jurusan} - ${j.nama_jurusan}</option>`).join('');

            filterKelasByJurusan();
        }

        function filterKelasByJurusan() {
            const jId = document.getElementById('filter-jurusan').value;
            const filteredKelas = jId ? allKelas.filter(k => k.jurusan_id == jId) : allKelas;
            document.getElementById('filter-kelas').innerHTML =
                '<option value="">Semua Kelas</option>' +
                filteredKelas.map(k => `<option value="${k.id}">${k.nama_kelas}</option>`).join('');
            renderCards();
        }

        function renderCards() {
            const jId = document.getElementById('filter-jurusan').value;
            const kId = document.getElementById('filter-kelas').value;
            const q = document.getElementById('filter-nama').value.toLowerCase();

            const filtered = allSiswa.filter(s =>
                (!jId || s.jurusan_id == jId) &&
                (!kId || s.kelas_id == kId) &&
                (s.nama_siswa.toLowerCase().includes(q) || s.nisn.includes(q))
            );

            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            if (filtered.length === 0) {
                container.innerHTML = '<div class="col-span-3 text-center py-12 text-slate-400">Tidak ada data siswa yang sesuai filter.</div>';
                return;
            }

            filtered.forEach((s, index) => {
                const qrDivId = `qr-${s.id}-${index}`;
                const cardHtml = `
                    <div class="student-card bg-white rounded-xl border border-slate-300 shadow-xs overflow-hidden flex flex-col justify-between">
                        <div class="bg-blue-800 text-white px-3.5 py-2.5 flex items-center justify-between border-b-2 border-amber-400">
                            <div>
                                <p class="text-[9px] uppercase tracking-widest text-blue-200 font-semibold">Kartu Absensi Digital</p>
                                <h2 class="text-xs font-extrabold tracking-wide">SMKN KASOMALANG</h2>
                            </div>
                            <span class="bg-amber-400 text-slate-900 text-[10px] font-extrabold px-2 py-0.5 rounded">${s.kode_jurusan}</span>
                        </div>

                        <div class="p-3.5 flex items-center gap-3.5">
                            <div id="${qrDivId}" class="p-1.5 bg-white border border-slate-200 rounded-lg shrink-0"></div>
                            <div class="min-w-0 flex-1">
                                <p class="text-[10px] font-mono text-slate-400">NISN: ${s.nisn}</p>
                                <h3 class="text-sm font-bold text-slate-900 leading-snug truncate" title="${s.nama_siswa}">${s.nama_siswa}</h3>
                                <p class="text-xs font-semibold text-blue-700 mt-0.5">${s.nama_kelas}</p>
                                <p class="text-[10px] text-slate-500 truncate mt-0.5">${s.nama_jurusan}</p>
                            </div>
                        </div>

                        <div class="bg-slate-50 px-3.5 py-1.5 border-t border-slate-200 flex justify-between items-center text-[9px] text-slate-500">
                            <span>Tempelkan QR saat masuk gerbang</span>
                            <span class="font-bold text-slate-700">TA 2026/2027</span>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', cardHtml);

                new QRCode(document.getElementById(qrDivId), {
                    text: s.nisn,
                    width: 82,
                    height: 82,
                    correctLevel: QRCode.CorrectLevel.M
                });
            });
        }

        init();
    </script>
</body>
</html>
