<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Login Absensi SMKN Kasomalang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4 font-sans selection:bg-blue-100 selection:text-blue-900">

    <!-- Kartu Utama (Selaras dengan Tema Terang Dashboard) -->
    <div class="w-full max-w-md bg-white border border-slate-200 rounded-2xl p-6 sm:p-8 shadow-lg space-y-6">

        <!-- HEADER / LOGO TIPOGRAFI -->
        <div class="text-center space-y-2 pb-4 border-b border-slate-100">
            <span class="inline-flex items-center gap-2 px-3 py-1 text-[11px] font-semibold tracking-wider uppercase text-blue-700 bg-blue-50 border border-blue-100 rounded-full">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                Absensi Siswa
            </span>

            <div class="space-y-1 pt-1">
                <h1 class="text-2xl font-extrabold tracking-tight text-slate-900">
                    SMKN <span class="text-blue-600">KASOMALANG</span>
                </h1>
                <div class="flex items-center justify-center gap-2 text-xs font-medium text-slate-500">
                    <span class="h-px w-4 bg-slate-200"></span>
                    <span>Portal Petugas</span>
                    <span class="h-px w-4 bg-slate-200"></span>
                </div>
            </div>
        </div>

        <!-- PANEL 1: FORM LOGIN TUNGGAL -->
        <div id="login-section" class="space-y-4">
            <form onsubmit="prosesLogin(event)" class="space-y-3.5">
                <div>
                    <div class="relative">
                        <i class="fa-solid fa-user text-xs text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="text" id="input-user" required placeholder="Masukkan username"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition">
                    </div>
                </div>
                <div>
                    <div class="relative">
                        <i class="fa-solid fa-lock text-xs text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
                        <input type="password" id="input-pass" required placeholder="Masukkan password"
                            class="w-full pl-10 pr-4 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-sm text-slate-800 placeholder-slate-400 focus:bg-white focus:outline-none focus:border-blue-600 focus:ring-2 focus:ring-blue-600/10 transition">
                    </div>
                </div>
                <button type="submit" id="btn-submit"
                    class="w-full py-3 bg-blue-600 hover:bg-blue-700 rounded-xl font-semibold text-sm text-white transition shadow-sm active:scale-[0.99] cursor-pointer">
                    Masuk
                </button>
            </form>

            <div id="login-error" class="hidden p-3 rounded-xl bg-rose-50 border border-rose-200 text-xs text-center text-rose-600 font-medium"></div>
        </div>

        <!-- PANEL 2: MENU SCANNER POS (Tampil setelah login berhasil) -->
        <div id="portal-section" class="hidden space-y-4">
            <div class="flex items-center justify-between bg-slate-50 border border-slate-200 px-4 py-2.5 rounded-xl">
                <span id="user-badge" class="text-xs font-semibold text-emerald-700">
                    <i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> Terverifikasi
                </span>
                <button onclick="logoutPortal()" class="text-[11px] text-rose-600 hover:text-rose-700 hover:underline font-semibold transition cursor-pointer">
                    <i class="fa-solid fa-power-off mr-1"></i> Keluar
                </button>
            </div>

            <!-- Kotak Status Server -->
            <div id="status-box" class="bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center space-y-1.5">
                <p class="text-xs text-slate-500">
                    <i class="fa-solid fa-spinner fa-spin text-blue-600 mr-1.5"></i> Memeriksa koneksi PC Server sekolah...
                </p>
            </div>

            <!-- Pilihan Pos Kamera Scanner -->
            <div id="menu-links" class="hidden space-y-2.5">
                <p class="text-[11px] uppercase tracking-wider text-slate-500 font-semibold px-1">Pilih Pos Kamera Scanner</p>
                <div class="grid grid-cols-2 gap-2.5">
                    <a id="btn-pos1" href="#" class="group p-3.5 bg-emerald-50 hover:bg-emerald-600 border border-emerald-200 hover:border-emerald-600 rounded-xl text-center text-xs font-bold text-emerald-700 hover:text-white transition">
                        <i class="fa-solid fa-camera block text-base mb-1.5 group-hover:scale-110 transition-transform"></i> Scanner POS 1
                    </a>
                    <a id="btn-pos2" href="#" class="group p-3.5 bg-emerald-50 hover:bg-emerald-600 border border-emerald-200 hover:border-emerald-600 rounded-xl text-center text-xs font-bold text-emerald-700 hover:text-white transition">
                        <i class="fa-solid fa-camera block text-base mb-1.5 group-hover:scale-110 transition-transform"></i> Scanner POS 2
                    </a>
                    <a id="btn-pos3" href="#" class="group p-3.5 bg-emerald-50 hover:bg-emerald-600 border border-emerald-200 hover:border-emerald-600 rounded-xl text-center text-xs font-bold text-emerald-700 hover:text-white transition">
                        <i class="fa-solid fa-camera block text-base mb-1.5 group-hover:scale-110 transition-transform"></i> Scanner POS 3
                    </a>
                    <a id="btn-pos4" href="#" class="group p-3.5 bg-emerald-50 hover:bg-emerald-600 border border-emerald-200 hover:border-emerald-600 rounded-xl text-center text-xs font-bold text-emerald-700 hover:text-white transition">
                        <i class="fa-solid fa-camera block text-base mb-1.5 group-hover:scale-110 transition-transform"></i> Scanner POS 4
                    </a>
                </div>
            </div>

            <button onclick="muatPortal()" class="w-full py-2.5 bg-slate-100 hover:bg-slate-200 border border-slate-200 rounded-xl text-xs font-semibold text-slate-700 transition cursor-pointer">
                <i class="fa-solid fa-rotate mr-1.5"></i> Cek Ulang Status Server
            </button>
        </div>

        <!-- FOOTER DENGAN DIRECT LINK TERSEMBUNYI KE DASHBOARD ADMIN -->
        <footer class="w-full pt-4 border-t border-slate-100 text-center">
            <p class="text-[11px] text-slate-400">
                &copy; 2026 Sistem Absensi <b class="font-semibold text-slate-600">SMKN Kasomalang</b>
                <span class="mx-1.5 text-slate-300">&bull;</span>
                <a id="secret-admin-link" href="#" onclick="return bukaDashboardTersembunyi(event)" title="Akses Dashboard Admin"
                   class="text-slate-400 hover:text-slate-500 transition cursor-default"><span class="font-semibold">Pengembang</span>
                </a>
            </p>
        </footer>

    </div>

    <script>
        const SUPABASE_URL = 'https://welaqxdegjvdxukjtmru.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_5Qi53DDHpMXan5aR-8xItw_YQsfLqAa';

        const headers = {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
        };

        let activeDashboardUrl = '';

        function tampilError(msg) {
            const el = document.getElementById('login-error');
            el.textContent = msg;
            el.classList.remove('hidden');
        }

        function bukaDashboardTersembunyi(e) {
            // Hanya bisa dibuka jika user sudah login di portal & server sedang aktif
            if (!activeDashboardUrl) {
                e.preventDefault();
                return false;
            }
            window.location.href = activeDashboardUrl;
            return false;
        }

        async function prosesLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('btn-submit');
            const errEl = document.getElementById('login-error');
            errEl.classList.add('hidden');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-1"></i> Memverifikasi...';

            const username = document.getElementById('input-user').value.trim();
            const password = document.getElementById('input-pass').value.trim();

            try {
                const res = await fetch(`${SUPABASE_URL}/rest/v1/users?username=eq.${encodeURIComponent(username)}&password=eq.${encodeURIComponent(password)}&select=id,username,nama_lengkap,role`, {
                    cache: 'no-store',
                    headers
                });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const users = await res.json();

                if (!users || users.length === 0) {
                    return tampilError('Username atau password salah!');
                }

                localStorage.setItem('portal_user', JSON.stringify({
                    username: users[0].username,
                    password: password,
                    nama: users[0].nama_lengkap,
                    role: users[0].role
                }));

                muatPortal();
            } catch (err) {
                tampilError('Gagal terhubung ke database: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = 'Masuk ke Portal <i class="fa-solid fa-right-to-bracket ml-1.5"></i>';
            }
        }

        function logoutPortal() {
            activeDashboardUrl = '';
            localStorage.removeItem('portal_user');
            document.getElementById('portal-section').classList.add('hidden');
            document.getElementById('login-section').classList.remove('hidden');
        }

        async function cekServerOnline(baseUrl) {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 5000);
            try {
                await fetch(`${baseUrl}/login.html`, {
                    mode: 'no-cors',
                    cache: 'no-store',
                    signal: controller.signal
                });
                clearTimeout(timeoutId);
                return true;
            } catch (e) {
                clearTimeout(timeoutId);
                return false;
            }
        }

        function tampilkanPesanServerMati(statusBox, menuLinks) {
            activeDashboardUrl = '';
            menuLinks.classList.add('hidden');
            statusBox.className = 'bg-rose-50 border border-rose-200 rounded-2xl p-4 text-center space-y-1.5';
            statusBox.innerHTML = `
                <div class="w-10 h-10 bg-rose-100 text-rose-600 rounded-full mx-auto flex items-center justify-center text-base">
                    <i class="fa-solid fa-plug-circle-xmark"></i>
                </div>
                <p class="text-sm font-bold text-rose-700">Server Sekolah Belum Aktif</p>
                <p class="text-xs text-slate-600 leading-relaxed">
                    Server di Lab belum dinyalakan atau aplikasi absensi belum berjalan.
                </p>
                <p class="text-[11px] text-slate-500 pt-0.5">
                    Nyalakan terlebih dahulu server atau aplikasi absensi, lalu klik tombol <i>Cek Ulang Status Server</i> di bawah.
                </p>
                <p class="text-[10px] italic text-slate-400 pt-1">
                    *Jika kendala masih berlanjut, harap hubungi operator.
                </p>
            `;
        }

        async function muatPortal() {
            const rawUser = localStorage.getItem('portal_user');
            if (!rawUser) return;

            const user = JSON.parse(rawUser);
            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('portal-section').classList.remove('hidden');
            document.getElementById('user-badge').innerHTML = `<i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> ${user.nama}`;

            const statusBox = document.getElementById('status-box');
            const menuLinks = document.getElementById('menu-links');

            statusBox.className = 'bg-slate-50 border border-slate-200 rounded-2xl p-4 text-center space-y-1';
            statusBox.innerHTML = `<p class="text-xs text-slate-500"><i class="fa-solid fa-spinner fa-spin text-blue-600 mr-1.5"></i> Memeriksa status PC Server sekolah...</p>`;
            menuLinks.classList.add('hidden');

            try {
                const [resUser, resCfg] = await Promise.all([
                    fetch(`${SUPABASE_URL}/rest/v1/users?username=eq.${encodeURIComponent(user.username)}&password=eq.${encodeURIComponent(user.password)}&select=id`, { cache: 'no-store', headers }),
                    fetch(`${SUPABASE_URL}/rest/v1/pengaturan?id=eq.1&select=url_publik`, { cache: 'no-store', headers })
                ]);

                const validUsers = await resUser.json();
                if (!validUsers || validUsers.length === 0) {
                    logoutPortal();
                    return tampilError('Password telah diubah. Silakan login kembali.');
                }

                const cfgRows = await resCfg.json();
                const cfg = cfgRows[0];

                if (!cfg || !cfg.url_publik) {
                    return tampilkanPesanServerMati(statusBox, menuLinks);
                }

                const baseUrl = cfg.url_publik.replace(/\/$/, '');
                const isOnline = await cekServerOnline(baseUrl);
                if (!isOnline) {
                    return tampilkanPesanServerMati(statusBox, menuLinks);
                }

                // Server aktif -> simpan URL Dashboard ke tautan tersembunyi di footer
                activeDashboardUrl = `${baseUrl}/login.html`;
                document.getElementById('secret-admin-link').href = activeDashboardUrl;

                const authToken = encodeURIComponent(btoa(`${user.username}:${user.password}`));

                statusBox.className = 'bg-emerald-50 border border-emerald-200 rounded-2xl p-3.5 text-center';
                statusBox.innerHTML = `<p class="text-xs text-emerald-700 font-bold"><i class="fa-solid fa-circle-check text-emerald-600 mr-1.5"></i> Server Sekolah Aktif & Siap Digunakan</p>`;

                document.getElementById('btn-pos1').href = `${baseUrl}/scan.html?pos=POS-1&token=${authToken}`;
                document.getElementById('btn-pos2').href = `${baseUrl}/scan.html?pos=POS-2&token=${authToken}`;
                document.getElementById('btn-pos3').href = `${baseUrl}/scan.html?pos=POS-3&token=${authToken}`;
                document.getElementById('btn-pos4').href = `${baseUrl}/scan.html?pos=POS-4&token=${authToken}`;

                const params = new URLSearchParams(window.location.search);
                const autoTarget = params.get('auto');
                if (autoTarget === 'dashboard') window.location.replace(activeDashboardUrl);
                if (autoTarget === 'pos1') window.location.replace(`${baseUrl}/scan.html?pos=POS-1&token=${authToken}`);
                if (autoTarget === 'pos2') window.location.replace(`${baseUrl}/scan.html?pos=POS-2&token=${authToken}`);
                if (autoTarget === 'pos3') window.location.replace(`${baseUrl}/scan.html?pos=POS-3&token=${authToken}`);
                if (autoTarget === 'pos4') window.location.replace(`${baseUrl}/scan.html?pos=POS-4&token=${authToken}`);

                menuLinks.classList.remove('hidden');
            } catch (err) {
                tampilkanPesanServerMati(statusBox, menuLinks);
            }
        }

        muatPortal();
    </script>
</body>
</html>
